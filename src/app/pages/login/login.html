<div class="auth-page">
  <div class="auth-card glass-card">
    <a routerLink="/" class="back-link">← Volver al inicio</a>
    <div class="auth-logo">
      <img src="/logo.png" alt="Thoth" class="logo-img" />
      <span class="logo-name">Thoth</span>
    </div>
    <h1 class="auth-title">Iniciar sesión</h1>
    <p class="auth-subtitle">Accede a tu cuenta para continuar</p>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="field">
        <label for="userName">Usuario</label>
        <input
          id="userName"
          type="text"
          [(ngModel)]="userName"
          name="userName"
          placeholder="Tu nombre de usuario"
          autocomplete="username"
        />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Tu contraseña"
          autocomplete="current-password"
        />
      </div>

      @if (errorMessage()) {
        <p class="error-msg">{{ errorMessage() }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        @if (isLoading()) { Cargando... } @else { Entrar }
      </button>
    </form>

    <p class="auth-footer">
      ¿No tienes cuenta?
      <a routerLink="/register">Crear cuenta</a>
    </p>
  </div>
</div>
