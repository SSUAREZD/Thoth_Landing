<div class="auth-page">
  <div class="auth-card glass-card">
    <a routerLink="/login" class="back-link">← Volver a iniciar sesión</a>
    <div class="auth-logo">
      <img src="/logo.png" alt="Thoth" class="logo-img" />
      <span class="logo-name">Thoth</span>
    </div>
    <h1 class="auth-title">Crear cuenta</h1>
    <p class="auth-subtitle">Regístrate para comenzar</p>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="field-row">
        <div class="field">
          <label for="name">Nombre</label>
          <input id="name" type="text" [(ngModel)]="name" name="name" placeholder="Juan" />
        </div>
        <div class="field">
          <label for="lastName">Apellido</label>
          <input id="lastName" type="text" [(ngModel)]="lastName" name="lastName" placeholder="Pérez" />
        </div>
      </div>
      <div class="field">
        <label for="userName">Usuario</label>
        <input id="userName" type="text" [(ngModel)]="userName" name="userName" placeholder="juanperez123" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Contraseña segura" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña" autocomplete="new-password" />
      </div>

      @if (errorMessage()) {
        <p class="error-msg">{{ errorMessage() }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        @if (isLoading()) { Creando cuenta... } @else { Crear cuenta }
      </button>
    </form>

    <p class="auth-footer">
      ¿Ya tienes cuenta?
      <a routerLink="/login">Iniciar sesión</a>
    </p>
  </div>
</div>
