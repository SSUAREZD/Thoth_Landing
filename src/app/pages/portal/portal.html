<div class="portal-layout">
  <!-- Sidebar -->
  <aside class="sidebar" [class.open]="sidebarOpen()">
    <div class="sidebar-header">
      <img src="/logo.png" alt="Thoth" class="sidebar-logo" />
      <span class="sidebar-brand">Thoth</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/app/home" routerLinkActive="active" class="nav-item" (click)="sidebarOpen.set(false)">
        <span>Inicio</span>
      </a>
      <a routerLink="/app/catalog" routerLinkActive="active" class="nav-item" (click)="sidebarOpen.set(false)">
        <span>Catálogo</span>
      </a>
      <a routerLink="/app/my-lines" routerLinkActive="active" class="nav-item" (click)="sidebarOpen.set(false)">
        <span>Mis Líneas</span>
      </a>
      <a routerLink="/app/measurements" routerLinkActive="active" class="nav-item" (click)="sidebarOpen.set(false)">
        <span>Medidas</span>
      </a>
<a routerLink="/app/settings" routerLinkActive="active" class="nav-item" (click)="sidebarOpen.set(false)">
        <span>Ajustes</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">{{ auth.currentUser()?.name?.charAt(0) }}</div>
        <div class="user-details">
          <span class="user-name">{{ auth.currentUser()?.name }}</span>
          <span class="user-username">&#64;{{ auth.currentUser()?.userName }}</span>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()">Salir</button>
    </div>
  </aside>

  <!-- Overlay for mobile -->
  @if (sidebarOpen()) {
    <div class="sidebar-overlay" (click)="sidebarOpen.set(false)"></div>
  }

  <!-- Main content -->
  <div class="main-content">
    <header class="topbar">
      <button class="menu-toggle" (click)="toggleSidebar()">☰</button>
      <span class="topbar-title">Thoth</span>
      <span class="topbar-user">{{ auth.currentUser()?.name }} {{ auth.currentUser()?.lastName }}</span>
    </header>
    <main class="page-content">
      <router-outlet />
    </main>
  </div>
</div>
