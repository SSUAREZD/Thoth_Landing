<div class="form-page">
  <a routerLink="/app/measurements" class="back-link">← Medidas</a>
  <h2>Nueva Medida</h2>

  <form (ngSubmit)="onSubmit()" class="form-card">
    <div class="field-row">
      <div class="field">
        <label>Parte del cuerpo</label>
        <select [(ngModel)]="bodyPart" name="bodyPart" class="form-select">
          <option value="FEET">Pies</option>
        </select>
      </div>
      <div class="field">
        <label>Unidad</label>
        <select [(ngModel)]="units" name="units" class="form-select">
          @for (u of unitOptions; track u) {
            <option [value]="u">{{ u }}</option>
          }
        </select>
      </div>
      <div class="field">
        <label>Lado</label>
        <select [(ngModel)]="side" name="side" class="form-select">
          @for (s of sideOptions; track s) {
            <option [value]="s">{{ s }}</option>
          }
        </select>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Longitud del pie</label>
        <input type="number" step="0.01" [(ngModel)]="footLength" name="footLength" placeholder="ej. 26.5" class="form-input" />
      </div>
      <div class="field">
        <label>Ancho del pie</label>
        <input type="number" step="0.01" [(ngModel)]="footWidth" name="footWidth" placeholder="ej. 9.8" class="form-input" />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Circunferencia del empeine</label>
        <input type="number" step="0.01" [(ngModel)]="instepGirth" name="instepGirth" placeholder="ej. 23.0" class="form-input" />
      </div>
      <div class="field">
        <label>Circunferencia del metatarso</label>
        <input type="number" step="0.01" [(ngModel)]="ballGirth" name="ballGirth" placeholder="ej. 22.5" class="form-input" />
      </div>
    </div>

    @if (errorMessage()) {
      <p class="error-msg">{{ errorMessage() }}</p>
    }

    <button type="submit" class="btn-primary" [disabled]="isLoading()">
      {{ isLoading() ? 'Guardando...' : 'Guardar medida' }}
    </button>
  </form>
</div>
