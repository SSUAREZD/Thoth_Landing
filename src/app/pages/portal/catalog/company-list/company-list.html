<div class="list-page">
  <div class="page-header">
    <h2>Catálogo de Marcas</h2>
    <input type="text" [(ngModel)]="search" placeholder="Buscar marca..." class="search-input" />
  </div>

  @if (isLoading()) {
    <div class="loading">Cargando marcas...</div>
  } @else if (errorMessage()) {
    <div class="error-box">
      {{ errorMessage() }}
      <button (click)="load()">Reintentar</button>
    </div>
  } @else if (filtered.length === 0) {
    <div class="empty-state">No se encontraron marcas.</div>
  } @else {
    <div class="items-list">
      @for (company of filtered; track company.id) {
        <a [routerLink]="['/app/catalog', company.id]" class="list-item">
          <div class="item-info">
            <span class="item-name">{{ company.name }}</span>
          </div>
          <span class="item-arrow">→</span>
        </a>
      }
    </div>
  }
</div>
