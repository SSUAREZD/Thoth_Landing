<section id="contact">
  <div class="container">
    <div class="contact-box glass-card">
      <div class="contact-copy">
        <span class="section-label">Cuéntanos</span>
        <h2>Descubre tu talla correcta antes de comprar</h2>
        <p>
          Nuestra tecnología utiliza mediciones corporales desde el teléfono para recomendar 
          la talla adecuada y reducir devoluciones en ecommerce de moda.
        </p>
      </div>

      <form class="contact-form">
        <input type="text" placeholder="Tu nombre" />
        <input type="email" placeholder="Tu correo" />
        <textarea rows="5" placeholder="¿Quieres probar la tecnología o conocer más sobre la solución?"></textarea>
        <button type="submit" class="btn btn-primary">Solicitar propuesta</button>
      </form>
    </div>
  </div>
</section>
