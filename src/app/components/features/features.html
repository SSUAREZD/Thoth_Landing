<section id="features">
  <div class="container">
    <h2 class="section-title">Descubre como <span class="highlight">Thoth</span> reduce devoluciones y aumenta ventas en
      <span class="highlight">2 simples pasos</span>
    </h2>
    <div class="features-grid">

      <button type="button" class="feature-card glass-card" [class.open]="openCards().has(0)" (click)="toggle(0)">
        <div class="card-header">
          <div class="feature-icon">01</div>
          <h3>Medición corporal real</h3>
          <span class="expand-icon">{{ openCards().has(0) ? '−' : '+' }}</span>
        </div>
        <div class="feature-detail">
          <div class="detail-content">
            <p>
              El usuario sostiene su teléfono y nuestra IA usa visión computacional para estimar
              sus medidas corporales clave en aproximadamente 2 minutos, sin necesidad de cinta
              métrica ni asistencia externa. Las medidas se almacenan de forma segura y pueden
              reutilizarse en futuras compras dentro del ecosistema Thoth.
            </p>
            <img src="/thoth_holding_phone.png" alt="Thoth midiendo con el teléfono" class="detail-image" />
          </div>
        </div>
      </button>

      <button type="button" class="feature-card glass-card" [class.open]="openCards().has(1)" (click)="toggle(1)">
        <div class="card-header">
          <div class="feature-icon">02</div>
          <h3>Recomendación de talla exacta</h3>
          <span class="expand-icon">{{ openCards().has(1) ? '−' : '+' }}</span>
        </div>
        <div class="feature-detail">
          <div class="detail-content">
            <p>
              Nuestro algoritmo cruza las medidas reales del usuario con la tabla de tallas
              específica de cada marca y prenda. El resultado es una única recomendación
              precisa, no un rango ni una estimación, lo que elimina la duda al comprar y
              reduce drásticamente las devoluciones por talla incorrecta.
            </p>
            <img src="/thoth_trying_shoes.png" alt="Thoth recomendando talla" class="detail-image" />
          </div>
        </div>
      </button>

    </div>
  </div>
</section>
